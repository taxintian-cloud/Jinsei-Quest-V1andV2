<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="">
	<meta name="author" content="Nittaku-WP">
	<link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<title>人生クエスト V2</title>
</head>
<body>
	<header>
        <img src="logo.png" alt="人生クエスト ロゴ">
    </header>
	<main class="layout">
        <div class="left-column">
            <section id="player-name">
                <label>冒険者名</label>
                <input type="text" id="player-name-input" placeholder="名前を入力">
                <button id="save-name-btn" class="btn btn-energy">保存</button>
            </section>

            <section id="player-status"></section>
        </div>

        <div class="right-column">
            <section id="quest-form">
                <img src="questplacetitle.png" alt="クエスト案内所の画像" class="quest-form-bg">
                <div class="quest-form-inner">
                    <h2>クエスト案内所</h2>
                    <div class="quest-form-row">
                        <input type="text" id="quest-input" placeholder="クエスト名を入力">
                    </div>

                    <div class="quest-form-row">
                        <select id="quest-size">
                            <option value="">クエストサイズを選択</option>
                            <option value="small">小クエスト</option>
                            <option value="middle">中クエスト</option>
                            <option value="large">大クエスト</option>
                        </select>

                        <input type="date" id="deadline-input">
                        <input id="category-input" placeholder="カテゴリ（任意）">
                    </div>
                    <div class="quest-submit">
                        <button id="add-btn" class="btn btn-primary">受注</button>
                    </div>
                </div>
            </section>

            <section id="category-manager">
                <h2>カテゴリ管理</h2>

                <div class="category-manager-row">
                    <input type="text" id="bulk-category-input" placeholder="カテゴリ名を入力">
                </div>

                <div class="category-manager-row">
                    <button id="start-category-btn" class="btn btn-energy">カテゴリ追加開始</button>
                    <button id="apply-category-btn" class="btn btn-energy hidden">決定</button>
                    <button id="cancel-category-btn" class="btn btn-energy hidden">キャンセル</button>
                </div>
                <div class="category-manager-row">
                    <select id="category-filter">
                        <option value="">すべてのカテゴリ</option>
                    </select>
                </div>
            </section>

            <section id="quest-list">
                <div class="quest-list-title-wrap">
                    <h2>クエスト一覧</h2>
                </div>

                <h3 id="today-title" class="hidden">今日のクエスト</h3>
                <ul id="quest-items"></ul>
                <h3 id="completed-title" class="hidden">達成済みクエスト</h3>
                <ul id="completed-quest-items" class="hidden"></ul>
            </section>
        </div>
    </main>
	<footer>
		<p>&copy; Nittaku-WP</p>
	</footer>
    <div id="levelup-message" class="hidden">
        <span class="en">LEVEL UP!!</span>
    </div>
    <div id="exp-popup"></div>
    <div id="confetti-container"></div>
    <div id="quest-start-popup" class="hidden">
        クエスト開始！
    </div>
    <div id="to-top">▲</div>
	<script src="script.js"></script>
</body>
</html>
