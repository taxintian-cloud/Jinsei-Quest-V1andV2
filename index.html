<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人生クエスト UI 完全版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="hero"></div>

    <main class="layout">
      <aside class="left-col">
        <section class="panel-wood">
          <h2 class="pill-title">冒険者登録所</h2>
          <div class="login-box">
            <label for="login-name">冒険者名</label>
            <input id="login-name" type="text" placeholder="名前を入力" />
            <button class="btn-gold btn-login">ログイン</button>
          </div>
        </section>

        <section class="status-box">
          <h3>プレイヤーステータス</h3>
          <p>なまえ: 冒険者</p>
          <p>Lv. 20</p>
          <p>総Exp: 0</p>
          <p>次のレベルまであと: 100Exp</p>
        </section>
      </aside>

      <section class="right-col">
        <section class="quest-board-desktop">
          <div class="scroll-paper">
            <div class="scroll-cap"></div>
            <div class="scroll-cap-right"></div>
            <div class="scroll-cap-bottom"></div>
            <div class="scroll-cap-bottom-right"></div>
          </div>
          <div class="scroll-content">
            <h2 class="board-title">クエスト案内所</h2>
            <div class="quest-fields">
              <input type="text" placeholder="クエスト名を入力" />
              <select>
                <option>クエストサイズを選択</option>
                <option>小クエスト</option>
                <option>中クエスト</option>
                <option>大クエスト</option>
              </select>
              <input type="date" />
              <input type="text" placeholder="カテゴリ（任意）" />
              <button class="btn-gold quest-submit-btn">受注</button>
            </div>
          </div>
        </section>

        <section class="quest-board-mobile">
          <div class="mobile-scroll-card">
            <div class="mobile-scroll-inner">
              <h2 class="board-title-mobile">クエスト案内所</h2>
              <div class="quest-fields-mobile">
                <input type="text" placeholder="クエスト名を入力" />
                <select>
                  <option>クエストサイズを選択</option>
                  <option>小クエスト</option>
                  <option>中クエスト</option>
                  <option>大クエスト</option>
                </select>
                <input type="date" />
                <input type="text" placeholder="カテゴリ（任意）" />
                <button class="btn-gold quest-submit-btn-mobile">受注</button>
              </div>
            </div>
          </div>
        </section>

        <section class="category-board-desktop">
          <h2 class="category-title">カテゴリ管理</h2>
          <div class="category-stack">
            <div class="category-section">
              <p class="category-label">カテゴリを追加</p>
              <input class="category-field" type="text" placeholder="カテゴリ名を入力" />
            </div>
            <div class="category-section">
              <button class="btn-gold category-btn">カテゴリ追加開始</button>
            </div>
            <div class="category-section">
              <p class="category-label">カテゴリで絞り込み</p>
              <select class="category-select">
                <option>すべてのカテゴリ</option>
              </select>
            </div>
          </div>
        </section>

        <section class="category-board-mobile">
          <h2 class="category-title-mobile">カテゴリ管理</h2>
          <div class="category-stack-mobile">
            <div class="category-section-mobile">
              <p class="category-label-mobile">カテゴリを追加</p>
              <input type="text" placeholder="カテゴリ名を入力" />
            </div>
            <div class="category-section-mobile">
              <button class="btn-gold category-btn-mobile">カテゴリ追加開始</button>
            </div>
            <div class="category-section-mobile">
              <p class="category-label-mobile">カテゴリで絞り込み</p>
              <select>
                <option>すべてのカテゴリ</option>
              </select>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
